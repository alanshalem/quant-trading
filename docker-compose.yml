services:
  jupyter:
    build:
      context: .
      target: jupyter
    container_name: quant-trading-jupyter
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8888:8888"
    volumes:
      # Mount project for live editing
      - .:/app
      # Persist Jupyter settings
      - jupyter-data:/root/.jupyter
    command: >
      bash -c "mkdir -p data/cache data/cache/ccxt data/models &&
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
      --ServerApp.root_dir=/app"
    profiles:
      - jupyter

  docs:
    build:
      context: .
      target: docs
    container_name: quant-trading-docs
    ports:
      - "8000:8000"
    volumes:
      - ./docs:/app/docs
      - ./mkdocs.yml:/app/mkdocs.yml:ro
      - ./README.md:/app/README.md:ro
      - ./src:/app/src:ro
    command: mkdocs serve --dev-addr 0.0.0.0:8000
    profiles:
      - docs

volumes:
  jupyter-data:
